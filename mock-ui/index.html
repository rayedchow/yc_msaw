<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>walter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #1A1A1A;
    --surface: #141414;
    --border: #2A2A2A;
    --border-strong: #3A3A3A;
    --text: #ECECEC;
    --muted: #B4B4B4;
    --tertiary: #8A8A8A;
    --accent: #C4B5FD;
    --accent-glow: rgba(196, 181, 253, 0.14);
    --grid-line: rgba(255, 255, 255, 0.035);
    --ok: #5BD08A;
    --warn: #F5C46B;
    --bad: #FF8A80;
    --maxw: 68rem;
    --sans: "Neue Haas Grotesk", "Helvetica Neue", "Inter Tight", Helvetica, Arial, sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.55; font-size: 15px; }
  h1 { margin: 0; font-weight: 700; letter-spacing: -0.045em; font-size: 32px; line-height: 1.1; }
  h2 { margin: 0; font-size: 13px; font-weight: 500; color: var(--tertiary); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: left; }
  code, pre, .mono { font-family: var(--mono); }
  code { font-size: .88em; }
  ::selection { background: var(--accent-glow); }

  /* honeyflow frame: ruled center column, faint grid outside */
  .frame { position: fixed; inset: 0; pointer-events: none; display: flex; justify-content: center; }
  .frame > div { width: 100%; max-width: var(--maxw); border-left: 1px solid var(--border); border-right: 1px solid var(--border); position: relative; }
  .frame > div::before, .frame > div::after { content: ""; position: absolute; top: 0; bottom: 0; width: 50vw; background-size: 32px 32px;
    background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px); }
  .frame > div::before { right: 100%; }
  .frame > div::after { left: 100%; }

  .top { position: sticky; top: 0; z-index: 20; }
  .strip { max-width: var(--maxw); margin: 0 auto; background: var(--accent); color: #141414; text-align: center; font-size: 12px; font-weight: 600; padding: 8px 16px; }
  nav { max-width: var(--maxw); margin: 0 auto; height: 58px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between;
    background: rgba(26,26,26,0.94); backdrop-filter: blur(8px); border: 1px solid var(--border); border-top: 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.04em; font-size: 17px; }
  .brand i { width: 16px; height: 16px; border: 2px solid var(--text); position: relative; }
  .brand i::after { content: ""; position: absolute; inset: 3px; background: var(--accent); }
  .crumb { display: flex; align-items: center; gap: 10px; margin-left: 22px; font-size: 14px; color: var(--tertiary); }
  .crumb button:hover { color: var(--text); }
  .crumb .cur { color: var(--text); }
  .org { font-size: 13px; color: var(--tertiary); }
  .pill { padding: 8px 16px; border-radius: 999px; background: var(--text); color: #141414; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .pill:hover { opacity: .88; }

  main { position: relative; z-index: 1; max-width: var(--maxw); margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); min-height: calc(100vh - 92px); }
  section { border-bottom: 1px solid var(--border); }
  .pad { padding: 28px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  .head p { margin: 8px 0 0; color: var(--muted); }
  .muted { color: var(--muted); }
  .dim { color: var(--tertiary); }
  .row { display: grid; }
  .row > * { border-right: 1px solid var(--border); }
  .row > *:last-child { border-right: 0; }
  .c2 { grid-template-columns: 1fr 1fr; }
  .c4 { grid-template-columns: repeat(4, 1fr); }
  .cell { padding: 20px 28px; }

  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .status.build i { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .status.ask i { background: var(--warn); }
  .tag { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border: 1px solid var(--border-strong); color: var(--muted); white-space: nowrap; }
  .tag.v { border-color: transparent; background: var(--accent); color: #141414; }

  /* list */
  .mcps .card, .mcps .hdr { display: grid; column-gap: 24px; grid-template-columns: 116px 1.6fr 1.1fr .5fr .7fr .5fr 24px; align-items: center; gap: 16px; padding: 22px 28px; width: 100%; }
  .mcps .card { border-top: 1px solid var(--border); }
  .mcps .card:hover { background: var(--surface); }
  .mcps .hdr { padding: 12px 28px; font-size: 13px; color: var(--tertiary); }
  .mcps .name { font-weight: 600; font-size: 16px; letter-spacing: -0.02em; }
  .mcps .sys { font-size: 13px; color: var(--tertiary); margin-top: 2px; }
  .mcps .num { font-family: var(--mono); font-size: 14px; }
  .mcps .arrow { color: var(--tertiary); }
  .mcps canvas { width: 116px; height: 116px; display: block; }
  .progress { height: 3px; background: var(--border); margin-top: 8px; width: 120px; }
  .progress i { display: block; height: 100%; background: var(--accent); }

  /* detail */
  .url { margin-top: 10px; font-family: var(--mono); font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 14px; }
  .url .status { font-family: var(--sans); }
  .stat .v { font-family: var(--mono); font-size: 24px; font-weight: 600; margin-top: 4px; }
  .stat .l { font-size: 13px; color: var(--muted); }
  .sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 22px 28px 12px; }
  .list .it { display: grid; gap: 16px; align-items: center; padding: 14px 28px; border-top: 1px solid var(--border); }
  .list .it.click:hover { background: var(--surface); cursor: pointer; }
  .list .it.sel { background: var(--surface); box-shadow: inset 2px 0 0 var(--accent); }
  .integ { grid-template-columns: 1.2fr 1.3fr 1fr auto; }
  .tool { grid-template-columns: 1.1fr 1.4fr 80px; }
  .tool .tag { justify-self: end; }
  .rule { grid-template-columns: 32px 1.4fr 1.3fr 80px; }
  .ver { grid-template-columns: 32px 1.5fr repeat(3, .8fr); font-size: 13px; }
  .rid { font-family: var(--mono); font-size: 12px; color: var(--tertiary); }
  .sig { font-family: var(--mono); font-size: 13.5px; }
  pre.code { margin: 0; padding: 12px 28px 14px 76px; font-size: 12.5px; line-height: 1.7; color: var(--muted); background: var(--surface); white-space: pre-wrap; border-top: 1px solid var(--border); }
  pre.box { margin: 0; padding: 14px 16px; font-size: 12.5px; line-height: 1.7; color: var(--muted); background: var(--surface); border: 1px solid var(--border); white-space: pre-wrap; }
  .q { margin: 20px 28px 24px; border: 1px solid var(--border-strong); }
  .q .body { padding: 14px 18px; }
  .q .opt { display: flex; gap: 12px; padding: 11px 18px; border-top: 1px solid var(--border); }
  .q .opt:hover { background: var(--surface); cursor: pointer; }
  .q .opt.picked { background: var(--accent-glow); }
  .q .opt b { font-family: var(--mono); color: var(--tertiary); font-weight: 500; }
  .tabs { display: flex; gap: 16px; }
  .tabs button { font-size: 13px; color: var(--tertiary); padding-bottom: 4px; border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .st { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .st i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .st.p { color: var(--tertiary); }
  .st.p i { background: var(--border-strong); }
  .empty { padding: 4px 28px 24px; color: var(--tertiary); font-size: 14px; }
  /* knowledge tree */
  .treewrap { position: relative; padding: 18px 0 8px;
    background-size: 24px 24px; background-image: linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px); }
  .tree { display: block; width: 100%; height: auto; font-family: var(--sans); }
  .tree .edge { fill: none; stroke: #3A3A3A; stroke-width: 1.2; transition: stroke .2s, opacity .2s; }
  .tree .edge.hl { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 4 4; animation: flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -16; } }
  .tree .node { cursor: default; transition: opacity .2s; }
  .tree .node rect:not(.logo) { fill: #161616; stroke: #333; transition: stroke .2s, fill .2s; }
  .tree .node.hl rect:not(.logo) { stroke: var(--accent); fill: #1D1B24; }
  .tree.focus .node:not(.hl), .tree.focus .edge:not(.hl) { opacity: .35; }
  .tree .nl { fill: var(--text); font-size: 13px; font-family: var(--mono); }
  .tree .ns { fill: var(--tertiary); font-size: 11.5px; }
  .tree .nh { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
  .tree .rule.asked rect { stroke: var(--accent); stroke-dasharray: 3 3; }
  .tree .rule.asked .nh { fill: var(--accent); }
  .tree .rule.running .nh { fill: var(--tertiary); }
  .tree .center rect:not(.logo) { fill: #1F1F1F; stroke: #4A4A4A; }
  .tree .center .logo { fill: var(--accent); stroke: none; }
  .tree .center .logot { fill: #141414; font-weight: 700; font-size: 18px; }
  .tree .cl { fill: var(--text); font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
  .tree .cs { fill: var(--muted); font-size: 12px; }
  .tree .blabel { fill: var(--tertiary); font-size: 12px; }
  .inspect { margin: 4px 28px 22px; padding: 14px 18px; min-height: 92px; border: 1px solid var(--border); background: #151515;
    display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; align-items: start; }
  .inspect > :not(pre) { grid-column: 1; }
  .inspect pre { grid-column: 2; grid-row: 1 / span 4; margin: 0; padding: 10px 12px; font-size: 12px; line-height: 1.6; color: var(--muted); background: var(--surface); border: 1px solid var(--border); white-space: pre-wrap; }
  .inspect .tk { font-size: 11px; color: var(--accent); font-family: var(--mono); margin-bottom: 4px; }
  .inspect .tt { font-size: 15px; font-weight: 600; }
  .inspect .td { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
  .inspect .tm { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .inspect .tm b { color: var(--text); font-family: var(--mono); font-weight: 500; }
  .q { margin: 24px 28px; }
</style>
</head>
<body>
<div class="frame"><div></div></div>

<div class="top">
  <div class="strip">Every company runs HubSpot differently. Its agents should get MCPs that know how.</div>
  <nav>
    <div style="display:flex;align-items:center">
      <div class="brand"><i></i>walter</div>
      <div class="crumb" id="crumb"></div>
    </div>
    <span class="org">GurtAI</span>
  </nav>
</div>

<main id="app"></main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

// ── data ──────────────────────────────────────────────────────────────────
const MCPS = [
  {
    id: "sales", name: "GurtAI Sales MCP", status: "live", version: "v3",
    url: "https://gurtai-sales.run.mcp-use.com/mcp",
    systems: ["HubSpot", "gurtai_analytics"],
    stats: { agents: 4, calls: "1,284", success: "99.2%", rules: 6 },
    integrations: [
      ["hubspot.md", "HubSpot CRM", "API · read, write to sandbox", "HUBSPOT_TOKEN"],
      ["warehouse.md", "gurtai_analytics", "Postgres · read only", "WAREHOUSE_URL"],
    ],
    md: `# HubSpot CRM (GurtAI)
Sales system of record.

## Notes
- Enterprise pipeline is ours
- Ask RevOps before trusting "Closed Won"`,
    tools: [
      ["get_commit(quarter)", "Committed revenue for a quarter", "R1 R2 R3"],
      ["import_leads(leads)", "Lead import, plan then commit", "R4 R5 R6"],
      ["find_account(domain)", "The one company for a domain", "R6"],
      ["report_outcome(…)", "Agents report what went wrong", "feedback"],
    ],
    mined: "3,104 historical changes · backtested on held-out Q3",
    rules: [
      ["R1", "Closed Won counts only when <code>booked</code>", "Set by RevOps on 97% of revenue deals", "98%", `isClosedWon(d) ? d.booked === true : isContractSent(d)`],
      ["R2", "Value is <code>arr</code>, not <code>amount</code>", "Σarr matches every reported quarter", "100%", `value = (d) => Number(d.arr)   // amount includes one-time services`],
      ["R3", "Partner Sandbox never counts", "Absent from every reported number", "100%", `eligible = (d) => d.pipeline !== "9900001"`],
      ["R4", "New leads owned by territory", "1,234 of 1,240 assignments", "100%", `owner = (c) => TERRITORY[c.country]   // EMEA 201 · AMER 202 · APAC 203`],
      ["R5", "Existing contacts keep their owner", "5 of 6 territory exceptions", "asked", `owner = (c, existing) => existing ? existing.owner : territoryOwner(c)`],
      ["R6", "Companies match on root domain", "All 41 past merges", "100%", `key = (url) => rootDomain(url)   // lowercase, no scheme, no www.`],
    ],
    question: { text: "5 of 6 territory exceptions are contacts that already existed. Do existing contacts always keep their owner?", options: ["Yes, never reassign them.", "No, always use territory."], rule: 4 },
    versions: [["v1", "First build", 3], ["v2", "R1 added after backtest", 3], ["v3", "R4 · import_leads plan → commit", 3]],
  },
  {
    id: "billing", name: "GurtAI Billing MCP", status: "live", version: "v2",
    url: "https://gurtai-billing.run.mcp-use.com/mcp",
    systems: ["Stripe", "gurtai_analytics"],
    stats: { agents: 2, calls: "412", success: "98.6%", rules: 4 },
    integrations: [
      ["stripe.md", "Stripe", "API · read only", "STRIPE_KEY"],
      ["warehouse.md", "gurtai_analytics", "Postgres · read only", "WAREHOUSE_URL"],
    ],
    md: `# Stripe (GurtAI)
Subscriptions and invoices.

## Notes
- Annual plans are invoiced monthly
- Test-mode customers are prefixed "qa_"`,
    tools: [
      ["get_mrr(month)", "Recurring revenue for a month", "B1 B2"],
      ["find_overdue(days)", "Invoices overdue past N days", "B3 B4"],
      ["report_outcome(…)", "Agents report what went wrong", "feedback"],
    ],
    mined: "18,920 invoices · backtested on held-out September",
    rules: [
      ["B1", "MRR excludes one-time line items", "Matches finance MRR in 12 of 12 months", "100%", `mrr = (sub) => sub.items.filter(isRecurring).reduce(sumMonthly, 0)`],
      ["B2", "Customers prefixed <code>qa_</code> are test data", "Never billed in live mode", "100%", `real = (c) => !c.id.startsWith("qa_")`],
      ["B3", "Overdue starts after a 5-day grace period", "Dunning starts on day 6 in 98% of cases", "97%", `overdue = (inv) => daysPastDue(inv) > 5`],
      ["B4", "Disputed invoices are never chased", "0 of 37 disputed invoices got reminders", "100%", `chase = (inv) => !inv.disputed`],
    ],
    question: null,
    versions: [["v1", "First build", 3], ["v2", "B3 grace period", 3]],
  },
  {
    id: "support", name: "GurtAI Support MCP", status: "build", version: "v1", progress: 62,
    url: "https://gurtai-support.run.mcp-use.com/mcp",
    systems: ["Zendesk"],
    stats: { agents: 0, calls: "—", success: "—", rules: 3 },
    integrations: [["zendesk.md", "Zendesk", "API · read only", "ZENDESK_TOKEN"]],
    md: `# Zendesk (GurtAI)
Customer support tickets.

## Notes
- The "priority" tag is set by a bot, not by people`,
    tools: [],
    mined: "Mining 41,880 tickets · 62%",
    rules: [
      ["S1", "Enterprise tickets escalate after 4 hours", "Matches 211 of 219 escalations", "running", `escalate = (t) => t.plan === "enterprise" && hoursOpen(t) > 4`],
      ["S2", "Tickets tagged <code>billing</code> go to Finance", "Reassigned in 96% of cases", "running", `queue = (t) => t.tags.includes("billing") ? "finance" : t.queue`],
      ["S3", "Auto-closed after 7 days without a reply", "Holds on 2,940 of 2,958", "running", `close = (t) => daysSinceReply(t) >= 7`],
    ],
    question: null,
    versions: [["v1", "First build", 0]],
  },
  {
    id: "finance", name: "GurtAI Finance MCP", status: "ask", version: "v1",
    url: "https://gurtai-finance.run.mcp-use.com/mcp",
    systems: ["NetSuite"],
    stats: { agents: 0, calls: "—", success: "—", rules: 2 },
    integrations: [["netsuite.md", "NetSuite", "API · read only", "NETSUITE_TOKEN"]],
    md: `# NetSuite (GurtAI)
General ledger and payables.`,
    tools: [
      ["find_payable_bills(period)", "Bills approved and due in a period", "F1 F2"],
      ["report_outcome(…)", "Agents report what went wrong", "feedback"],
    ],
    mined: "9,402 bills · backtested on held-out Q3",
    rules: [
      ["F1", "<code>custbody_14</code> is the real approval flag", "Set on 98% of paid bills, rarely on unpaid ones", "asked", `approved = (b) => b.custbody_14 === true`],
      ["F2", "Closed periods are never edited", "0 edits after period close in 2 years", "100%", `editable = (b) => !periodClosed(b.period)`],
    ],
    question: { text: "custbody_14 and custbody_22 agree on 91% of bills but disagree on 37. Which one should gate payment?", options: ["custbody_14", "custbody_22"], rule: 0 },
    versions: [["v1", "Waiting on one answer", 1]],
  },
];

const STATUS = { live: ["", "Live"], build: ["build", "Mining"], ask: ["ask", "Needs an answer"] };
const statusEl = (m) => `<span class="status ${STATUS[m.status][0]}"><i></i>${STATUS[m.status][1]}${m.status === "live" ? " · " + m.version : ""}</span>`;

// ── list ──────────────────────────────────────────────────────────────────
function renderList() {
  $("#crumb").innerHTML = `<span class="cur">MCPs</span>`;
  $("#app").innerHTML = `
    <section class="pad head">
      <div>
        <h1>MCPs</h1>
        <p>GurtAI's internal MCP servers. Each one knows how GurtAI actually uses its systems. Any agent can connect.</p>
      </div>
      <button class="pill">New MCP</button>
    </section>
    <section class="mcps">
      <div class="hdr"><span>Last 24h</span><span>Server</span><span>Status</span><span>Agents</span><span>Calls · 24h</span><span>Rules</span><span></span></div>
      ${MCPS.map((m) => `
        <button class="card" data-id="${m.id}">
          <canvas data-dots="${m.id}"></canvas>
          <span><div class="name">${m.name}</div><div class="sys">${m.systems.join(" · ")}</div></span>
          <span>${statusEl(m)}${m.status === "build" ? `<div class="progress"><i style="width:${m.progress}%"></i></div>` : ""}</span>
          <span class="num">${m.stats.agents}</span>
          <span class="num">${m.stats.calls}</span>
          <span class="num">${m.stats.rules}</span>
          <span class="arrow">→</span>
        </button>`).join("")}
    </section>`;
  $$(".mcps .card").forEach((c) => c.onclick = () => (location.hash = c.dataset.id));
  startDots();
}

// ── detail ────────────────────────────────────────────────────────────────
const SHORT = {
  R1: "booked gate", R2: "arr, not amount", R3: "sandbox excluded", R4: "owner by territory", R5: "keep existing owner", R6: "root domain",
  B1: "recurring only", B2: "qa_ is test", B3: "5-day grace", B4: "skip disputed",
  S1: "4h escalation", S2: "billing → finance", S3: "7-day auto-close",
  F1: "custbody_14 approves", F2: "closed periods locked",
};
const strip = (h) => h.replace(/<[^>]+>/g, "");
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");

function treeModel(m) {
  const W = 1032, cx = W / 2, cy = 150;
  const NW = 196, NH = 46, CW = 220, CH = 72;
  const col = (items, x) => items.map((it, i) => ({ ...it, x, y: cy - ((items.length - 1) * 62) / 2 + i * 62 - NH / 2 }));
  const integ = col(m.integrations.map(([f, n, d, s]) => ({ kind: "integ", key: f, label: n, sub: f, f, n, d, s })), 24);
  const tools = col(m.tools.map(([sig, d, r]) => ({ kind: "tool", key: sig, label: sig.replace(/\(.*$/, ""), sub: r === "feedback" ? "agent feedback" : r, sig, d, rules: r.split(" ").filter((x) => /^[A-Z]\d$/.test(x)) })), W - 24 - NW);
  const busY = 290, ruleY = 330, RW = Math.min(150, (W - 48 - (m.rules.length - 1) * 14) / m.rules.length);
  const totalW = m.rules.length * RW + (m.rules.length - 1) * 14;
  const rules = m.rules.map(([id, t, ev, h, code], i) => ({ kind: "rule", key: id, id, t, ev, h, code, x: cx - totalW / 2 + i * (RW + 14), y: ruleY, w: RW }));
  for (const r of rules) r.tools = tools.filter((t) => t.rules.includes(r.id)).map((t) => t.key);
  const H = rules.length ? ruleY + 60 + 24 : cy + 120;
  return { W, H, cx, cy, NW, NH, CW, CH, busY, integ, tools, rules };
}

function treeSvg(m, T) {
  const { W, H, cx, cy, NW, NH, CW, CH, busY } = T;
  const left = cx - CW / 2, right = cx + CW / 2;
  const edges = [];
  for (const n of T.integ) {
    const y = n.y + NH / 2, mx = (n.x + NW + left) / 2;
    edges.push(`<path class="edge" data-for="${esc(n.key)}" d="M${n.x + NW} ${y} H${mx} V${cy} H${left}"/>`);
  }
  for (const n of T.tools) {
    const y = n.y + NH / 2, mx = (right + n.x) / 2;
    edges.push(`<path class="edge" data-for="${esc(n.key)}" data-rules="${n.rules.join(" ")}" d="M${right} ${cy} H${mx} V${y} H${n.x}"/>`);
  }
  if (T.rules.length) {
    edges.push(`<path class="edge trunk" d="M${cx} ${cy + CH / 2} V${busY}"/>`);
    for (const r of T.rules) edges.push(`<path class="edge" data-for="${r.key}" d="M${cx} ${busY} H${r.x + r.w / 2} V${r.y}"/>`);
  }
  const label = (x, y, text, anchor = "start") => `<text class="blabel" x="${x}" y="${y}" text-anchor="${anchor}">${text}</text>`;
  const box = (n, w, extra = "") => `
    <g class="node ${n.kind} ${extra}" data-key="${esc(n.key)}" transform="translate(${n.x} ${n.y})">
      <rect width="${w}" height="${NH}" rx="3"/>
      <text class="nl" x="14" y="20">${esc(n.label)}</text>
      <text class="ns" x="14" y="35">${esc(n.sub)}</text>
    </g>`;
  const ruleBox = (r) => {
    const st = r.h === "asked" ? "asked" : r.h === "running" ? "running" : "ok";
    return `
    <g class="node rule ${st}" data-key="${r.key}" transform="translate(${r.x} ${r.y})">
      <rect width="${r.w}" height="${NH + 6}" rx="3"/>
      <text class="nl mono" x="12" y="20">${r.id}</text>
      <text class="nh" x="${r.w - 12}" y="20" text-anchor="end">${r.h === "asked" ? "asked" : r.h === "running" ? "testing" : r.h}</text>
      <text class="ns" x="12" y="38">${esc(SHORT[r.id] ?? "")}</text>
    </g>`;
  };
  return `
  <svg viewBox="0 0 ${W} ${H}" class="tree" role="img" aria-label="${esc(m.name)} knowledge tree">
    ${T.integ.length ? label(24, T.integ[0].y - 14, `Integrations · ${T.integ.length}`) : ""}
    ${T.tools.length ? label(W - 24, T.tools[0].y - 14, `Tools · ${T.tools.length}`, "end") : label(W - 24, cy - 40, "Tools · generated after backtests", "end")}
    ${T.rules.length ? label(24, busY - 12, `Tribal knowledge · ${T.rules.length} rules · ${m.mined}`) : ""}
    ${edges.join("")}
    ${T.integ.map((n) => box(n, NW)).join("")}
    ${T.tools.map((n) => box(n, NW)).join("")}
    ${T.rules.map(ruleBox).join("")}
    <g class="node center" data-key="__center" transform="translate(${left} ${cy - CH / 2})">
      <rect width="${CW}" height="${CH}" rx="4"/>
      <text class="cl" x="${CW / 2}" y="32" text-anchor="middle">${esc(m.name.replace("GurtAI ", ""))}</text>
      <text class="cs" x="${CW / 2}" y="50" text-anchor="middle">${STATUS[m.status][1]}${m.status === "live" ? " · " + m.version : ""}</text>
    </g>
  </svg>`;
}

function tipHtml(m, T, key) {
  if (key === "__center") return `<div class="tt">${esc(m.name)}</div><div class="tm mono">${esc(m.url)}</div><div class="td">${m.systems.join(" · ")} · ${T.tools.length} tools · ${T.rules.length} rules</div>`;
  const r = T.rules.find((x) => x.key === key);
  if (r) return `<div class="tk">${r.id} · ${r.h === "asked" ? "waiting on an answer" : r.h === "running" ? "backtest running" : "held-out " + r.h}</div>
    <div class="tt">${r.t}</div><div class="td">${r.ev}</div><pre>${esc(r.code)}</pre>
    ${r.tools.length ? `<div class="tm">Compiled into ${r.tools.map((t) => `<code>${esc(t.replace(/\(.*$/, ""))}</code>`).join(", ")}</div>` : ""}`;
  const t = T.tools.find((x) => x.key === key);
  if (t) return `<div class="tk">Tool</div><div class="tt mono">${esc(t.sig)}</div><div class="td">${t.d}</div>
    <div class="tm">${t.rules.length ? "Rules applied: " + t.rules.map((id) => `<b>${id}</b> ${esc(SHORT[id] ?? "")}`).join(" · ") : "How agents report a wrong result or a missing capability"}</div>`;
  const n = T.integ.find((x) => x.key === key);
  if (n) return `<div class="tk">${n.f}</div><div class="tt">${esc(n.n)}</div><div class="td">${n.d} · <span class="mono">${n.s} ••••••</span> injected by the host</div><pre>${esc(m.md)}</pre>`;
  return "";
}

function renderDetail(m) {
  $("#crumb").innerHTML = `<button id="back">MCPs</button><span>/</span><span class="cur">${m.name}</span>`;
  $("#back").onclick = () => (location.hash = "");
  const T = treeModel(m);
  const snippets = {
    url: `${m.url}\nAuthorization: Bearer <agent token>`,
    claude: `{ "mcpServers": { "gurtai-${m.id}": {\n  "url": "${m.url}" } } }`,
    cursor: `// .cursor/mcp.json\n{ "mcpServers": { "gurtai-${m.id}": {\n  "url": "${m.url}" } } }`,
  };

  $("#app").innerHTML = `
    <section class="pad head">
      <div>
        <h1>${m.name}</h1>
        <div class="url">${statusEl(m)}<span>${m.url}</span></div>
      </div>
      <button class="pill" id="copy">Copy URL</button>
    </section>

    <section class="row c4">
      <div class="cell stat"><div class="l">Agents connected</div><div class="v">${m.stats.agents}</div></div>
      <div class="cell stat"><div class="l">Calls · 24h</div><div class="v">${m.stats.calls}</div></div>
      <div class="cell stat"><div class="l">Successful calls</div><div class="v">${m.stats.success}</div></div>
      <div class="cell stat"><div class="l">Rules compiled</div><div class="v">${m.stats.rules}</div></div>
    </section>

    <section class="treewrap" id="treewrap">
      ${treeSvg(m, T)}
      <div class="inspect" id="tip"></div>
    </section>

    ${m.question ? `
    <section>
      <div class="q" id="question">
        <div class="body"><div class="dim" style="font-size:13px;margin-bottom:6px">Question for a human · history can't settle this</div>${m.question.text}</div>
        ${m.question.options.map((o, i) => `<div class="opt" data-a="${i}"><b>${"AB"[i]}</b>${o}</div>`).join("")}
      </div>
    </section>` : ""}

    <section class="row c2">
      <div>
        <div class="sechead"><h2>Connect any agent</h2>
          <div class="tabs" id="tabs"><button class="on" data-c="url">URL</button><button data-c="claude">Claude</button><button data-c="cursor">Cursor</button></div>
        </div>
        <div style="padding:0 28px 24px"><pre class="box" id="snippet"></pre></div>
      </div>
      <div>
        <div class="sechead"><h2>Versions</h2><span class="dim" style="font-size:13px">tests → evals → live</span></div>
        <div class="list">${m.versions.map(([v, why, s]) => `<div class="it ver"><span class="mono dim">${v}</span><span class="muted">${why}</span>${["tests", "evals", "live"].map((l, i) => `<span class="st ${s > i ? "" : "p"}"><i></i>${l}</span>`).join("")}</div>`).join("")}</div>
      </div>
    </section>`;

  // hover: highlight the node, its branch and related nodes; show the card
  const wrap = $("#treewrap"), tip = $("#tip"), svg = $(".tree", wrap);
  const idle = `<div class="tk">Hover any node</div><div class="td">Integrations feed the MCP, rules are mined from their history, and tools apply those rules in code.</div>`;
  const clear = () => { $$(".hl", svg).forEach((e) => e.classList.remove("hl")); svg.classList.remove("focus"); tip.innerHTML = idle; };
  const lightRule = (id) => { $(`.node[data-key="${id}"]`, svg)?.classList.add("hl"); $(`.edge[data-for="${id}"]`, svg)?.classList.add("hl"); $(".trunk", svg)?.classList.add("hl"); };
  $$(".node", svg).forEach((g) => {
    g.addEventListener("mouseenter", () => {
      clear();
      const key = g.dataset.key;
      svg.classList.add("focus");
      g.classList.add("hl");
      $(".node.center", svg).classList.add("hl");
      $$(`.edge[data-for="${CSS.escape(key)}"]`, svg).forEach((e) => e.classList.add("hl"));
      const tool = T.tools.find((t) => t.key === key);
      if (tool) tool.rules.forEach(lightRule);
      const rule = T.rules.find((r) => r.key === key);
      if (rule) { lightRule(rule.id); rule.tools.forEach((k) => { $(`.node[data-key="${CSS.escape(k)}"]`, svg)?.classList.add("hl"); $(`.edge[data-for="${CSS.escape(k)}"]`, svg)?.classList.add("hl"); }); }
      if (key === "__center") $$(".node, .edge", svg).forEach((e) => e.classList.add("hl"));
      tip.innerHTML = tipHtml(m, T, key);
      // lift lit edges above dimmed ones so shared segments read as lit
      $$(".edge.hl", svg).forEach((e) => e.parentNode.insertBefore(e, $(".node", svg)));
    });
  });
  svg.addEventListener("mouseleave", clear);
  clear();

  $("#snippet").textContent = snippets.url;
  $$("#tabs button").forEach((b) => b.onclick = () => { $$("#tabs button").forEach((x) => x.classList.toggle("on", x === b)); $("#snippet").textContent = snippets[b.dataset.c]; });
  $("#copy").onclick = () => navigator.clipboard?.writeText(m.url);
  $$("#question .opt").forEach((o) => o.onclick = () => {
    $$("#question .opt").forEach((x) => x.classList.toggle("picked", x === o));
    const r = m.rules[m.question.rule];
    if (r[3] === "asked") r[3] = "100%";
    setTimeout(() => renderDetail(m), 350);
  });
}

// ── dot matrix: 12 × 12, one column per 2-hour window ───────────────────
const COLS = 12, ROWS = 12, GAP = 9.6, R = 2.9, SIZE = 116;
const VOLUME = {
  sales: [3,2,2,1,1,2,4,6,8,9,9,8,7,9,9,8,7,6,5,5,4,4,3,3],
  billing: [1,1,1,0,0,1,2,3,4,4,3,3,3,4,4,3,3,2,2,2,1,1,1,1],
};
let dotRaf = 0;
function startDots() {
  cancelAnimationFrame(dotRaf);
  const canvases = $$("canvas[data-dots]");
  const dpr = window.devicePixelRatio || 1;
  for (const c of canvases) { c.width = SIZE * dpr; c.height = SIZE * dpr; c.getContext("2d").scale(dpr, dpr); }
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue("--accent").trim(), warn = css.getPropertyValue("--warn").trim();
  const frame = (t) => {
    if (!document.body.contains(canvases[0])) return;
    for (const c of canvases) {
      const m = MCPS.find((x) => x.id === c.dataset.dots);
      const ctx = c.getContext("2d");
      ctx.clearRect(0, 0, SIZE, SIZE);
      for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) {
        const cx = 2 + x * GAP + R, cy = 2 + y * GAP + R;
        let color = "rgba(255,255,255,0.08)", a = 1;
        if (m.status === "live") {
          const v = VOLUME[m.id];
          const lit = ((v[2 * x] + v[2 * x + 1]) / 18) * ROWS;
          if (ROWS - y <= lit) {
            const wave = 0.55 + 0.45 * Math.sin(t / 700 - x * 0.6 + y * 0.35);
            color = `rgba(196,181,253,${0.35 + 0.6 * wave})`;
          }
        } else if (m.status === "build") {
          const filled = Math.floor((m.progress / 100) * COLS * ROWS);
          const i = x * ROWS + y;
          if (i < filled) color = `rgba(196,181,253,${0.55 + 0.25 * Math.sin(t / 650 - x * 0.5)})`;
          else if (i === filled) color = accent;
        } else if (m.status === "ask") {
          if (x === 8 && y === 3) { color = warn; a = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t / 300)); }
        }
        ctx.globalAlpha = a;
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    dotRaf = requestAnimationFrame(frame);
  };
  dotRaf = requestAnimationFrame(frame);
}

function route() {
  const [id, opt] = location.hash.slice(1).split(",");
  const m = MCPS.find((x) => x.id === id);
  m ? renderDetail(m) : renderList();
  // #sales,hover=R1 opens a node's card (handy for screenshots and demos)
  const hover = /^hover=(.+)$/.exec(opt ?? "")?.[1];
  if (m && hover) setTimeout(() => $(`.node[data-key="${CSS.escape(decodeURIComponent(hover))}"]`)?.dispatchEvent(new Event("mouseenter")), 50);
  window.scrollTo({ top: 0 });
}
window.addEventListener("hashchange", route);
route();
</script>
