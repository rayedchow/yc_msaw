<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>walter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #1A1A1A;
    --surface: #141414;
    --border: #2A2A2A;
    --border-strong: #3A3A3A;
    --text: #ECECEC;
    --muted: #B4B4B4;
    --tertiary: #8A8A8A;
    --accent: #C4B5FD;
    --accent-glow: rgba(196, 181, 253, 0.14);
    --grid-line: rgba(255, 255, 255, 0.035);
    --ok: #5BD08A;
    --warn: #F5C46B;
    --bad: #FF8A80;
    --maxw: 68rem;
    --sans: "Neue Haas Grotesk", "Helvetica Neue", "Inter Tight", Helvetica, Arial, sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.55; font-size: 15px; }
  h1 { margin: 0; font-weight: 700; letter-spacing: -0.045em; font-size: 32px; line-height: 1.1; }
  h2 { margin: 0; font-size: 13px; font-weight: 500; color: var(--tertiary); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: left; }
  code, pre, .mono { font-family: var(--mono); }
  code { font-size: .88em; }
  ::selection { background: var(--accent-glow); }

  /* honeyflow frame: ruled center column, faint grid outside */
  .frame { position: fixed; inset: 0; pointer-events: none; display: flex; justify-content: center; }
  .frame > div { width: 100%; max-width: var(--maxw); border-left: 1px solid var(--border); border-right: 1px solid var(--border); position: relative; }
  .frame > div::before, .frame > div::after { content: ""; position: absolute; top: 0; bottom: 0; width: 50vw; background-size: 32px 32px;
    background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px); }
  .frame > div::before { right: 100%; }
  .frame > div::after { left: 100%; }

  .top { position: sticky; top: 0; z-index: 20; }
  .strip { max-width: var(--maxw); margin: 0 auto; background: var(--accent); color: #141414; text-align: center; font-size: 12px; font-weight: 600; padding: 8px 16px; }
  nav { max-width: var(--maxw); margin: 0 auto; height: 58px; padding: 17px 28px 0; display: flex; align-items: baseline; justify-content: space-between;
    background: rgba(26,26,26,0.94); backdrop-filter: blur(8px); border: 1px solid var(--border); border-top: 0; }
  .brand { color: inherit; text-decoration: none; cursor: pointer; display: inline-block; font-family: "Playfair Display", Georgia, serif; font-style: italic; font-weight: 500; font-size: 25px; letter-spacing: 0.07em; line-height: 1; }
  .crumb { display: flex; align-items: center; gap: 10px; margin-left: 22px; font-size: 14px; color: var(--tertiary); }
  .crumb button:hover { color: var(--text); }
  .crumb .cur { color: var(--text); }
  .org { font-size: 13px; color: var(--tertiary); }
  .pill { padding: 8px 16px; border-radius: 999px; background: var(--text); color: #141414; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .pill:hover { opacity: .88; }

  main { position: relative; z-index: 1; max-width: var(--maxw); margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); min-height: calc(100vh - 92px); }
  section { border-bottom: 1px solid var(--border); }
  .pad { padding: 28px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  .head p { margin: 8px 0 0; color: var(--muted); }
  .muted { color: var(--muted); }
  .dim { color: var(--tertiary); }
  .row { display: grid; }
  .row > * { border-right: 1px solid var(--border); }
  .row > *:last-child { border-right: 0; }
  .c2 { grid-template-columns: 1fr 1fr; }
  .c4 { grid-template-columns: repeat(4, 1fr); }
  .cell { padding: 20px 28px; }

  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .status.build i { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .status.ask i { background: var(--warn); }
  .tag { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border: 1px solid var(--border-strong); color: var(--muted); white-space: nowrap; }
  .tag.v { border-color: transparent; background: var(--accent); color: #141414; }

  /* list */
  .mcps .card, .mcps .hdr { display: grid; column-gap: 24px; grid-template-columns: 116px 1.6fr 1.1fr .5fr .7fr .5fr 24px; align-items: center; gap: 16px; padding: 22px 28px; width: 100%; }
  .mcps .card { border-top: 1px solid var(--border); }
  .mcps .card:hover { background: var(--surface); }
  .mcps .hdr { padding: 12px 28px; font-size: 13px; color: var(--tertiary); }
  .mcps .name { font-weight: 600; font-size: 16px; letter-spacing: -0.02em; }
  .mcps .sys { font-size: 13px; color: var(--tertiary); margin-top: 2px; }
  .mcps .num { font-family: var(--mono); font-size: 14px; }
  .mcps .arrow { color: var(--tertiary); }
  .mcps canvas { width: 116px; height: 116px; display: block; }
  .progress { height: 3px; background: var(--border); margin-top: 8px; width: 120px; }
  .progress i { display: block; height: 100%; background: var(--accent); }

  /* detail */
  .url { margin-top: 10px; font-family: var(--mono); font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 14px; }
  .url .status { font-family: var(--sans); }
  .stat .v { font-family: var(--mono); font-size: 24px; font-weight: 600; margin-top: 4px; }
  .stat .l { font-size: 13px; color: var(--muted); }
  .sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 22px 28px 12px; }
  .list .it { display: grid; gap: 16px; align-items: center; padding: 14px 28px; border-top: 1px solid var(--border); }
  .list .it.click:hover { background: var(--surface); cursor: pointer; }
  .list .it.sel { background: var(--surface); box-shadow: inset 2px 0 0 var(--accent); }
  .integ { grid-template-columns: 1.2fr 1.3fr 1fr auto; }
  .tool { grid-template-columns: 1.1fr 1.4fr 80px; }
  .tool .tag { justify-self: end; }
  .rule { grid-template-columns: 32px 1.4fr 1.3fr 80px; }
  .ver { grid-template-columns: 32px 1.5fr repeat(3, .8fr); font-size: 13px; }
  .rid { font-family: var(--mono); font-size: 12px; color: var(--tertiary); }
  .sig { font-family: var(--mono); font-size: 13.5px; }
  pre.code { margin: 0; padding: 12px 28px 14px 76px; font-size: 12.5px; line-height: 1.7; color: var(--muted); background: var(--surface); white-space: pre-wrap; border-top: 1px solid var(--border); }
  pre.box { margin: 0; padding: 14px 16px; font-size: 12.5px; line-height: 1.7; color: var(--muted); background: var(--surface); border: 1px solid var(--border); white-space: pre-wrap; }
  .q { margin: 20px 28px 24px; border: 1px solid var(--border-strong); }
  .q .body { padding: 14px 18px; }
  .q .opt { display: flex; gap: 12px; padding: 11px 18px; border-top: 1px solid var(--border); }
  .q .opt:hover { background: var(--surface); cursor: pointer; }
  .q .opt.picked { background: var(--accent-glow); }
  .q .opt b { font-family: var(--mono); color: var(--tertiary); font-weight: 500; }
  .tabs { display: flex; gap: 16px; }
  .tabs button { font-size: 13px; color: var(--tertiary); padding-bottom: 4px; border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .st { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .st i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .st.p { color: var(--tertiary); }
  .st.p i { background: var(--border-strong); }
  .empty { padding: 4px 28px 24px; color: var(--tertiary); font-size: 14px; }
  /* knowledge tree */
  .treewrap { position: relative; padding: 18px 0 8px;
    background-size: 24px 24px; background-image: linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px); }
  .tree { display: block; width: 100%; height: auto; font-family: var(--sans); }
  .tree .edge { fill: none; stroke: #3A3A3A; stroke-width: 1.2; transition: stroke .2s, opacity .2s; }
  .tree .edge.hl { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 4 4; animation: flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -16; } }
  .tree .node { cursor: pointer; transition: opacity .2s; }
  .tree .node rect:not(.logo) { fill: #161616; stroke: #333; transition: stroke .2s, fill .2s; }
  .tree .node.hl rect:not(.logo) { stroke: var(--accent); fill: #1D1B24; }
  .tree.focus .node:not(.hl), .tree.focus .edge:not(.hl) { opacity: .35; }
  .tree .nl { fill: var(--text); font-size: 13px; font-family: var(--mono); }
  .tree .ns { fill: var(--tertiary); font-size: 11.5px; }
  .tree .nh { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
  .tree .rule.asked rect { stroke: var(--accent); stroke-dasharray: 3 3; }
  .tree .rule.asked .nh { fill: var(--accent); }
  .tree .rule.running .nh { fill: var(--tertiary); }
  .tree .center rect:not(.logo) { fill: #1F1F1F; stroke: #4A4A4A; }
  .tree .center .logo { fill: var(--accent); stroke: none; }
  .tree .center .logot { fill: #141414; font-weight: 700; font-size: 18px; }
  .tree .cl { fill: var(--text); font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
  .tree .cs { fill: var(--muted); font-size: 12px; }
  .tree .blabel { fill: var(--tertiary); font-size: 12px; }
  .inspect { margin: 4px 28px 22px; padding: 14px 18px; min-height: 92px; border: 1px solid var(--border); background: #151515;
    display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; align-items: start; }
  .inspect > :not(pre) { grid-column: 1; }
  .inspect pre { grid-column: 2; grid-row: 1 / span 4; margin: 0; padding: 10px 12px; font-size: 12px; line-height: 1.6; color: var(--muted); background: var(--surface); border: 1px solid var(--border); white-space: pre-wrap; }
  .inspect .tk { font-size: 11px; color: var(--accent); font-family: var(--mono); margin-bottom: 4px; }
  .inspect .tt { font-size: 15px; font-weight: 600; }
  .inspect .td { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
  .inspect .tm { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .inspect .tm b { color: var(--text); font-family: var(--mono); font-weight: 500; }
  .q { margin: 24px 28px; }
  .pill.ghost { background: transparent; color: var(--text); border: 1px solid var(--border-strong); }
  .crumb button { color: var(--tertiary); }
  /* evals */
  .c3 { grid-template-columns: repeat(3, 1fr); }
  .evhero .cell { padding: 22px 28px 24px; }
  .evhero .l { font-size: 13px; color: var(--muted); }
  .evhero .big { font-family: var(--mono); font-size: 44px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.1; margin: 6px 0 2px; }
  .evhero .big span { font-size: 22px; color: var(--tertiary); margin-left: 2px; }
  .evhero .this .big { color: var(--accent); }
  .meter { height: 4px; background: var(--border); margin-top: 14px; }
  .meter i { display: block; height: 100%; background: var(--muted); }
  .evhero .this .meter i { background: var(--accent); }
  .legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--tertiary); }
  .legend .d { margin-left: 6px; }
  .d { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; transition: transform .15s, box-shadow .15s; }
  .d.ok { background: var(--accent); }
  .d.no { background: transparent; border: 1.5px solid #4A4A4A; }
  .matrix { padding: 6px 28px 10px; }
  .mrow { display: grid; grid-template-columns: 170px repeat(3, 1fr); align-items: center; padding: 12px 0; border-top: 1px solid var(--border); }
  .mrow.mhead { border-top: 0; font-size: 13px; color: var(--muted); padding-bottom: 8px; }
  .mname { font-size: 12.5px; color: var(--muted); }
  .grp { display: flex; gap: 9px; padding-left: 20px; border-left: 1px solid var(--border); }
  .mhead .grp { border-left-color: transparent; }
  .matrix .d { cursor: pointer; }
  .matrix .d.hl { transform: scale(1.35); box-shadow: 0 0 0 3px var(--accent-glow); }
  .inspect .okc { color: var(--ok); font-weight: 500; font-size: 13px; margin-left: 8px; }
  .inspect .noc { color: var(--bad); font-weight: 500; font-size: 13px; margin-left: 8px; }
  .bt { grid-template-columns: 32px 1fr 64px; }
  .bars2 { display: flex; flex-direction: column; gap: 4px; }
  .b2 { height: 5px; background: var(--border); }
  .b2 i { display: block; height: 100%; }
  .b2 i.tr, .b.tr { background: #6A6A6A; }
  .b2 i.ho, .b.ho { background: var(--accent); }
  .b { width: 14px; height: 5px; display: inline-block; margin-left: 6px; }
  .tc { grid-template-columns: 1.4fr repeat(3, 1fr); }
  .chk { font-size: 14px; }
  .chk.ok { color: var(--accent); }
  .chk.no { color: var(--bad); }
  .vchart { display: flex; gap: 40px; align-items: flex-end; padding: 8px 28px 26px; height: 210px; }
  .vcol { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 64px; font-size: 13px; }
  .vbar { width: 28px; height: 140px; background: var(--border); position: relative; }
  .vbar i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); }
  /* MCP page tabs + evals strip */
  .ptabs { display: flex; justify-content: flex-start; margin: 0; gap: 28px; padding: 0 28px; border-bottom: 1px solid var(--border); max-width: none; height: auto; background: none; backdrop-filter: none; border-left: 0; border-right: 0; }
  .ptabs a { padding: 12px 0 13px; font-size: 14px; color: var(--tertiary); text-decoration: none; border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .ptabs a:hover { color: var(--text); }
  .ptabs a.on { color: var(--text); border-bottom-color: var(--accent); }
  .tbadge { font-family: var(--mono); font-size: 11px; padding: 1px 6px; background: var(--accent); color: #141414; }
  .tbadge.dim { background: var(--border); color: var(--tertiary); }
  .evstrip .cell { padding: 18px 28px 20px; }
  .evstrip .l { font-size: 13px; color: var(--muted); }
  .evstrip .v { font-family: var(--mono); font-size: 28px; font-weight: 600; letter-spacing: -0.03em; margin-top: 2px; }
  .evstrip .v span { font-size: 15px; color: var(--tertiary); margin-left: 2px; }
  .evstrip .this .v { color: var(--accent); }
  .evstrip .meter { margin-top: 10px; }
  .evstrip .this .meter i { background: var(--accent); }
  .evlink { display: flex; flex-direction: column; justify-content: center; gap: 4px; text-decoration: none; color: var(--text); background: rgba(196,181,253,0.06); cursor: pointer; }
  .evlink:hover { background: rgba(196,181,253,0.12); }
  .evlink .go { font-size: 16px; font-weight: 600; color: var(--accent); }
  /* evals v2 */
  .tbadge.warn { background: var(--warn); }
  .evstrip .v.warn, .evsum .v.warn { color: var(--warn); }
  .evsum .cell { padding: 20px 28px 22px; }
  .evsum .l { font-size: 13px; color: var(--muted); }
  .evsum .v { font-family: var(--mono); font-size: 32px; font-weight: 600; letter-spacing: -0.03em; margin-top: 4px; }
  .evsum .v span { font-size: 17px; color: var(--tertiary); }
  .evsum .s { font-size: 12.5px; margin-top: 2px; }
  .okc { color: var(--ok); font-size: 13px; }
  .warnc { color: var(--warn); }
  .rp { grid-template-columns: 1.8fr 1fr 1fr 100px 80px; font-size: 14px; }
  .rpd { display: none; grid-template-columns: 1fr 2.4fr; gap: 16px; padding: 0 28px 16px; font-size: 13.5px; color: var(--muted); background: var(--surface); }
  .rpd.on { display: grid; }
  .re { grid-template-columns: 32px 1.5fr 1.1fr auto 100px; column-gap: 28px; font-size: 14px; }
  .sbar { display: block; height: 3px; background: var(--border); margin-top: 6px; width: 140px; }
  .sbar i { display: block; height: 100%; background: var(--accent); }
  .mstrip { width: calc(var(--n) * 24px - 4px); display: grid; grid-template-columns: repeat(var(--n), 20px); gap: 4px; align-items: center; }
  .mrange { display: grid; width: calc(var(--n) * 24px - 4px); grid-template-columns: calc(var(--h) * 24px - 4px) 1fr; gap: 4px; font-size: 11.5px; }
  .mrange span { border-top: 1px solid var(--border-strong); padding-top: 4px; white-space: nowrap; }
  .mrange span:last-child { border-top-color: var(--accent); }
  .sq { width: 16px; height: 16px; display: inline-block; border-radius: 2px; justify-self: center; }
  .sq.hi { background: var(--accent); }
  .sq.mid { background: rgba(196,181,253,0.4); }
  .sq.low { background: var(--warn); }
  .sq.none { background: transparent; border: 1px dashed var(--border-strong); }
  .sq.ho { outline: 1px solid rgba(255,255,255,0.35); outline-offset: 1px; }
  .legend .sq { width: 10px; height: 10px; margin-left: 6px; }
  .fields { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 28px 8px; }
  .fchip { font-family: var(--mono); font-size: 12.5px; padding: 6px 10px; border: 1px solid var(--border-strong); cursor: pointer; }
  .fchip.understood { border-color: rgba(196,181,253,0.5); color: var(--text); background: rgba(196,181,253,0.07); }
  .fchip.deprecated { color: var(--tertiary); text-decoration: line-through; }
  .fchip.unknown { border-color: var(--warn); color: var(--warn); border-style: dashed; }
  .chip-d { width: 10px; height: 10px; display: inline-block; margin-left: 6px; }
  .chip-d.understood { background: rgba(196,181,253,0.6); }
  .chip-d.deprecated { background: var(--border-strong); }
  .chip-d.unknown { border: 1px dashed var(--warn); }
  .evline { display: flex; flex-wrap: wrap; gap: 10px 36px; padding: 18px 28px; font-size: 14.5px; color: var(--muted); }
  .evline b { color: var(--text); font-weight: 600; }
  .evline .dt { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 10px; vertical-align: 1px; }
  .dt.ok { background: var(--ok); }
  .dt.mid { background: var(--accent); }
  .dt.warn { background: var(--warn); }
  .rtool { display: block; font-size: 11.5px; color: var(--tertiary); margin-top: 2px; }
</style>
</head>
<body>
<div class="frame"><div></div></div>

<div class="top">
  <div class="strip">Every company runs HubSpot differently. Its agents should get MCPs that know how.</div>
  <nav>
    <div style="display:flex;align-items:baseline">
      <a class="brand" href="#">walter</a>
      <div class="crumb" id="crumb"></div>
    </div>
    <span class="org">GurtAI</span>
  </nav>
</div>

<main id="app"></main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

// ── data ──────────────────────────────────────────────────────────────────
let MCPS = [];   // from /api/state: built from mined knowledge, deploys and live usage
let EVALS = {};

const STATUS = { live: ["", "Live"], build: ["build", "Building"], ask: ["ask", "Needs an answer"] };
const statusEl = (m) => `<span class="status ${STATUS[m.status][0]}"><i></i>${STATUS[m.status][1]}${m.status === "live" ? " · " + m.version : ""}</span>`;

// ── list ──────────────────────────────────────────────────────────────────
function renderList() {
  $("#crumb").innerHTML = "";
  $("#app").innerHTML = `
    <section class="pad head">
      <div>
        <h1>MCPs</h1>
        <p>GurtAI's internal MCP servers. Each one knows how GurtAI actually uses its systems. Any agent can connect.</p>
      </div>
    </section>
    <section class="mcps">
      <div class="hdr"><span>Last 24h</span><span>Server</span><span>Status</span><span>Agents</span><span>Calls · 24h</span><span>Rules</span><span></span></div>
      ${MCPS.length ? "" : `<div class="empty" style="padding:28px">No MCPs yet. Run the miner to build the first one.</div>`}
      ${MCPS.map((m) => `
        <button class="card" data-id="${m.id}">
          <canvas data-dots="${m.id}"></canvas>
          <span><div class="name">${m.name}</div><div class="sys">${m.systems.join(" · ")}</div></span>
          <span>${statusEl(m)}${m.status === "build" ? `<div class="progress"><i style="width:${m.progress}%"></i></div>` : ""}</span>
          <span class="num">${m.stats.agents}</span>
          <span class="num">${m.stats.calls}</span>
          <span class="num">${m.stats.rules}</span>
          <span class="arrow">→</span>
        </button>`).join("")}
    </section>`;
  $$(".mcps .card").forEach((c) => c.onclick = () => (location.hash = c.dataset.id));
  startDots();
}

// ── shared MCP header + tabs (Overview · Evals) ───────────────────────────
function mcpHeader(m, active) {
  const sc = evalScore(m);
  return `
    <section class="pad head" style="padding-bottom:20px">
      <div>
        <h1>${m.name}</h1>
        <div class="url">${statusEl(m)}<span>${m.url}</span></div>
      </div>
      <button class="pill" id="copy">Copy URL</button>
    </section>
    <nav class="ptabs">
      <a href="#${m.id}" class="${active === "overview" ? "on" : ""}">Overview</a>
      <a href="#${m.id}/evals" class="${active === "evals" ? "on" : ""}">Evals ${sc ? `<span class="tbadge ${sc.drift ? "warn" : ""}">${sc.confirmed}/${sc.rules} rules${sc.drift ? " · change" : ""}</span>` : `<span class="tbadge dim">pending</span>`}</a>
    </nav>`;
}
function evalStrip(m) {
  const sc = evalScore(m);
  if (!sc) return `
    <section class="evstrip">
      <div class="cell"><div class="l">Evals</div><div class="dim" style="font-size:14px;margin-top:6px">Start once mining finishes and rules can be checked against history.</div></div>
    </section>`;
  return `
    <section class="evstrip">
      <div class="row" style="grid-template-columns: repeat(3, 1fr) 220px">
        <div class="cell"><div class="l">Rules confirmed by history</div><div class="v">${sc.confirmed}<span>/${sc.rules}</span></div></div>
        <div class="cell"><div class="l">Past work replayed exactly</div><div class="v">${sc.replaysOk}<span>/${sc.replays}</span></div></div>
        <div class="cell"><div class="l">Changes detected</div><div class="v ${sc.drift ? "warn" : ""}">${sc.drift}</div></div>
        <a class="cell evlink" href="#${m.id}/evals"><span class="l">How sure is walter?</span><span class="go">Open evals →</span><span class="dim" style="font-size:12px">checked against GurtAI's history</span></a>
      </div>
    </section>`;
}

// ── detail ────────────────────────────────────────────────────────────────
const SHORT = {};   // rule id → short label, filled from the API
const clip = (t, n) => (t.length > n ? t.slice(0, n - 1) + "…" : t);
const strip = (h) => h.replace(/<[^>]+>/g, "");
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");

function treeModel(m) {
  const W = 1032, cx = W / 2, span = Math.max(m.integrations.length, m.tools.length, 1), cy = Math.max(150, (span - 1) * 31 + 60);
  const NW = 196, NH = 46, CW = 220, CH = 72;
  const col = (items, x) => items.map((it, i) => ({ ...it, x, y: cy - ((items.length - 1) * 62) / 2 + i * 62 - NH / 2 }));
  const integ = col(m.integrations.map(([f, n, d, s]) => ({ kind: "integ", key: f, label: n, sub: f, f, n, d, s })), 24);
  const tools = col(m.tools.map(([sig, d, r]) => ({ kind: "tool", key: sig, label: sig.replace(/\(.*$/, ""), sub: r === "feedback" ? "agent feedback" : r, sig, d, rules: r.split(" ").filter((x) => /^[A-Z][A-Za-z0-9_-]*$/.test(x) && x !== "feedback") })), W - 24 - NW);
  const busY = Math.max(290, cy + (span - 1) * 31 + 23 + 26), ruleY = busY + 40, RW = Math.min(150, (W - 48 - (m.rules.length - 1) * 14) / m.rules.length);
  const totalW = m.rules.length * RW + (m.rules.length - 1) * 14;
  for (const r of m.rules) SHORT[r[0]] = r[5];
  const rules = m.rules.map(([id, t, ev, h, code], i) => ({ kind: "rule", key: id, id, t, ev, h, code, x: cx - totalW / 2 + i * (RW + 14), y: ruleY, w: RW }));
  for (const r of rules) r.tools = tools.filter((t) => t.rules.includes(r.id)).map((t) => t.key);
  const H = rules.length ? ruleY + 60 + 24 : cy + 120;
  return { W, H, cx, cy, NW, NH, CW, CH, busY, integ, tools, rules };
}

function treeSvg(m, T) {
  const { W, H, cx, cy, NW, NH, CW, CH, busY } = T;
  const left = cx - CW / 2, right = cx + CW / 2;
  const edges = [];
  for (const n of T.integ) {
    const y = n.y + NH / 2, mx = (n.x + NW + left) / 2;
    edges.push(`<path class="edge" data-for="${esc(n.key)}" d="M${n.x + NW} ${y} H${mx} V${cy} H${left}"/>`);
  }
  for (const n of T.tools) {
    const y = n.y + NH / 2, mx = (right + n.x) / 2;
    edges.push(`<path class="edge" data-for="${esc(n.key)}" data-rules="${n.rules.join(" ")}" d="M${right} ${cy} H${mx} V${y} H${n.x}"/>`);
  }
  if (T.rules.length) {
    edges.push(`<path class="edge trunk" d="M${cx} ${cy + CH / 2} V${busY}"/>`);
    for (const r of T.rules) edges.push(`<path class="edge" data-for="${r.key}" d="M${cx} ${busY} H${r.x + r.w / 2} V${r.y}"/>`);
  }
  const label = (x, y, text, anchor = "start") => `<text class="blabel" x="${x}" y="${y}" text-anchor="${anchor}">${text}</text>`;
  const box = (n, w, extra = "") => `
    <g class="node ${n.kind} ${extra}" data-key="${esc(n.key)}" transform="translate(${n.x} ${n.y})">
      <rect width="${w}" height="${NH}" rx="3"/>
      <text class="nl" x="14" y="20">${esc(n.label)}</text>
      <text class="ns" x="14" y="35">${esc(n.sub)}</text>
    </g>`;
  const ruleBox = (r) => {
    const st = r.h === "asked" || r.h === "change" ? "asked" : r.h === "running" ? "running" : "ok";
    return `
    <g class="node rule ${st}" data-key="${r.key}" transform="translate(${r.x} ${r.y})">
      <rect width="${r.w}" height="${NH + 6}" rx="3"/>
      <text class="nl mono" x="12" y="20">${r.id}</text>
      <text class="nh" x="${r.w - 12}" y="20" text-anchor="end">${r.h === "asked" ? "asked" : r.h === "running" ? "testing" : r.h}</text>
      <text class="ns" x="12" y="38">${esc(clip((SHORT[r.id] ?? "").replace(/->/g, "→"), Math.max(8, Math.floor((r.w - 18) / 6.2))))}</text>
    </g>`;
  };
  return `
  <svg viewBox="0 0 ${W} ${H}" class="tree" role="img" aria-label="${esc(m.name)} knowledge tree">
    ${T.integ.length ? label(24, T.integ[0].y - 14, `Integrations · ${T.integ.length}`) : ""}
    ${T.tools.length ? label(W - 24, T.tools[0].y - 14, `Tools · ${T.tools.length}`, "end") : label(W - 24, cy - 40, "Tools · generated after backtests", "end")}
    ${T.rules.length ? label(24, busY - 12, `Tribal knowledge · ${T.rules.length} rules`) : ""}
    ${edges.join("")}
    ${T.integ.map((n) => box(n, NW)).join("")}
    ${T.tools.map((n) => box(n, NW)).join("")}
    ${T.rules.map(ruleBox).join("")}
    <g class="node center" data-key="__center" transform="translate(${left} ${cy - CH / 2})">
      <rect width="${CW}" height="${CH}" rx="4"/>
      <text class="cl" x="${CW / 2}" y="32" text-anchor="middle">${esc(m.name.replace("GurtAI ", ""))}</text>
      <text class="cs" x="${CW / 2}" y="50" text-anchor="middle">${STATUS[m.status][1]}${m.status === "live" ? " · " + m.version : ""}</text>
    </g>
  </svg>`;
}

function tipHtml(m, T, key) {
  if (key === "__center") return `<div class="tt">${esc(m.name)}</div><div class="tm mono">${esc(m.url)}</div><div class="td">${m.systems.join(" · ")} · ${T.tools.length} tools · ${T.rules.length} rules</div>`;
  const r = T.rules.find((x) => x.key === key);
  if (r) return `<div class="tk">${r.id} · ${r.h === "asked" ? "waiting on an answer" : r.h === "change" ? "stopped matching recent history" : r.h === "running" ? "backtest running" : "held-out " + r.h}</div>
    <div class="tt">${r.t}</div><div class="td">${r.ev}</div><pre>${esc(r.code)}</pre>
    ${r.tools.length ? `<div class="tm">Compiled into ${r.tools.map((t) => `<code>${esc(t.replace(/\(.*$/, ""))}</code>`).join(", ")}</div>` : ""}`;
  const t = T.tools.find((x) => x.key === key);
  if (t) return `<div class="tk">Tool</div><div class="tt mono">${esc(t.sig)}</div><div class="td">${t.d}</div>
    <div class="tm">${t.rules.length ? "Rules applied: " + t.rules.map((id) => `<b>${id}</b> ${esc(SHORT[id] ?? "")}`).join(" · ") : "How agents report a wrong result or a missing capability"}</div>`;
  const n = T.integ.find((x) => x.key === key);
  if (n) return `<div class="tk">${n.f}</div><div class="tt">${esc(n.n)}</div><div class="td">${n.d} · <span class="mono">${n.s} ••••••</span> injected by the host</div><pre>${esc(m.md)}</pre>`;
  return "";
}

function renderDetail(m) {
  $("#crumb").innerHTML = `<button id="back">MCPs</button><span>/</span><span class="cur">${m.name}</span>`;
  $("#back").onclick = () => (location.hash = "");
  const T = treeModel(m);
  const snippets = {
    url: `${m.url}\nAuthorization: Bearer <agent token>`,
    claude: `{ "mcpServers": { "gurtai-${m.id}": {\n  "url": "${m.url}" } } }`,
    cursor: `// .cursor/mcp.json\n{ "mcpServers": { "gurtai-${m.id}": {\n  "url": "${m.url}" } } }`,
  };

  $("#app").innerHTML = `
    ${mcpHeader(m, "overview")}


    <section class="treewrap" id="treewrap">
      ${treeSvg(m, T)}
      <div class="inspect" id="tip"></div>
    </section>

    ${m.job && m.job.status !== "done" ? `
    <section class="pad" style="padding-top:16px;padding-bottom:16px">
      <span class="${m.job.status === "failed" ? "warnc" : "muted"}">${m.job.status === "failed" ? "Rebuild failed" : "Rebuilding"} · ${esc(m.job.steps.at(-1)?.text ?? "starting")}</span>
    </section>` : ""}
    ${m.question && !(m.job && m.job.status === "running") ? `
    <section>
      <div class="q" id="question">
        <div class="body"><div class="dim" style="font-size:13px;margin-bottom:6px">Question for a human · history can't settle this</div>${m.question.text}${m.question.evidence ? `<div class="dim" style="font-size:13px;margin-top:6px">${esc(m.question.evidence)}</div>` : ""}</div>
        ${m.question.options.map((o, i) => `<div class="opt" data-a="${i}"><b>${"ABCD"[i]}</b>${o}</div>`).join("")}
      </div>
    </section>` : ""}

    <section class="row c2">
      <div>
        <div class="sechead"><h2>Connect any agent</h2>
          <div class="tabs" id="tabs"><button class="on" data-c="url">URL</button><button data-c="claude">Claude</button><button data-c="cursor">Cursor</button></div>
        </div>
        <div style="padding:0 28px 24px"><pre class="box" id="snippet"></pre></div>
      </div>
      <div>
        <div class="sechead"><h2>Versions</h2><span class="dim" style="font-size:13px">tests → evals → live</span></div>
        <div class="list">${m.versions.map(([v, why, s]) => `<div class="it ver"><span class="mono dim">${v}</span><span class="muted">${why}</span>${["tests", "evals", "live"].map((l, i) => `<span class="st ${s > i ? "" : "p"}"><i></i>${l}</span>`).join("")}</div>`).join("")}</div>
      </div>
    </section>`;

  // hover: highlight the node, its branch and related nodes; show the card
  const wrap = $("#treewrap"), tip = $("#tip"), svg = $(".tree", wrap);
  const idle = `<div class="tk">Hover any node</div><div class="td">Integrations feed the MCP, rules are mined from their history, and tools apply those rules in code.</div>`;
  const clear = () => { $$(".hl", svg).forEach((e) => e.classList.remove("hl")); svg.classList.remove("focus"); tip.innerHTML = idle; };
  const lightRule = (id) => { $(`.node[data-key="${id}"]`, svg)?.classList.add("hl"); $(`.edge[data-for="${id}"]`, svg)?.classList.add("hl"); $(".trunk", svg)?.classList.add("hl"); };
  $$(".node", svg).forEach((g) => {
    g.addEventListener("mouseenter", () => {
      clear();
      const key = g.dataset.key;
      svg.classList.add("focus");
      g.classList.add("hl");
      $(".node.center", svg).classList.add("hl");
      $$(`.edge[data-for="${CSS.escape(key)}"]`, svg).forEach((e) => e.classList.add("hl"));
      const tool = T.tools.find((t) => t.key === key);
      if (tool) tool.rules.forEach(lightRule);
      const rule = T.rules.find((r) => r.key === key);
      if (rule) { lightRule(rule.id); rule.tools.forEach((k) => { $(`.node[data-key="${CSS.escape(k)}"]`, svg)?.classList.add("hl"); $(`.edge[data-for="${CSS.escape(k)}"]`, svg)?.classList.add("hl"); }); }
      if (key === "__center") $$(".node, .edge", svg).forEach((e) => e.classList.add("hl"));
      tip.innerHTML = tipHtml(m, T, key);
      // lift lit edges above dimmed ones so shared segments read as lit
      $$(".edge.hl", svg).forEach((e) => e.parentNode.insertBefore(e, $(".node", svg)));
    });
  });
  svg.addEventListener("mouseleave", clear);
  clear();

  $("#snippet").textContent = snippets.url;
  $$("#tabs button").forEach((b) => b.onclick = () => { $$("#tabs button").forEach((x) => x.classList.toggle("on", x === b)); $("#snippet").textContent = snippets[b.dataset.c]; });

    if (!r.ok) { alert((await r.json()).error); return; }
    await load(true);
  });
}

// ── evals: is walter's understanding of the system correct? ───────────────
// Everything is checked against the system's own history: replays of past work compared with what was recorded,
// each rule against the decisions people made, and coverage of the system's custom fields.
function evalScore(m) {
  const E = EVALS[m.id];
  if (!E) return null;
  const confirmed = E.rules.filter((r) => !r.asked).length;
  const replaysOk = E.replays.filter((r) => r.ok).length;
  return { confirmed, rules: E.rules.length, replaysOk, replays: E.replays.length, open: E.rules.filter((r) => r.asked).length, drift: E.rules.filter((r) => r.drift).length };
}

function renderEvals(m) {
  $("#crumb").innerHTML = `<button id="back">MCPs</button><span>/</span><span class="cur">${m.name}</span>`;
  $("#back").onclick = () => (location.hash = "");
  const copy = () => { $("#copy").onclick = () => navigator.clipboard?.writeText(m.url); };
  const E = EVALS[m.id];
  if (!E) {
    $("#app").innerHTML = `
      ${mcpHeader(m, "evals")}
      <section><div class="empty" style="padding:28px">Evals start once mining finishes and the first rules can be checked against history. ${m.status === "ask" ? "This MCP is waiting on one answer." : "Mining is still in progress."}</div></section>`;
    copy();
    return;
  }
  const sc = evalScore(m);
  const W = E.window;
  const shade = (v) => v == null ? "none" : v >= 97 ? "hi" : v >= 90 ? "mid" : "low";

  $("#app").innerHTML = `
    ${mcpHeader(m, "evals")}
    <section class="pad" style="padding-top:20px;padding-bottom:20px"><span class="muted">Is walter's understanding of GurtAI right? Every check below is against the system's own history. </span><span class="dim">${E.source}</span></section>

    <section class="evline">
      <span><i class="dt ${sc.confirmed === sc.rules ? "ok" : "mid"}"></i><b>${sc.confirmed} of ${sc.rules}</b> rules confirmed by history${sc.open ? ` <span class="dim">· ${sc.open} waiting on an answer</span>` : ""}</span>
      <span><i class="dt ${sc.replaysOk === sc.replays ? "ok" : "mid"}"></i><b>${sc.replaysOk} of ${sc.replays}</b> replays match the record</span>
      <span><i class="dt ${sc.drift ? "warn" : "ok"}"></i><b>${sc.drift ? sc.drift + (sc.drift === 1 ? " change" : " changes") : "No changes"}</b> detected</span>
    </section>

    <section>
      <div class="sechead"><h2>Replays against history</h2><span class="dim" style="font-size:13px">past work re-run through the MCP and compared exactly with the record</span></div>
      <div class="list" id="replays">
        <div class="it rp dim" style="font-size:12px"><span>Task</span><span>Recorded</span><span>MCP</span><span>Period</span><span></span></div>
        ${E.replays.map((r, i) => `
          <div class="it rp click" data-i="${i}">
            <span>${r.task}<span class="rtool mono">${r.via.split(" · ")[0]}</span></span>
            <span class="mono">${r.truth}</span>
            <span class="mono ${r.ok ? "" : "warnc"}">${r.got}</span>
            <span><span class="tag ${r.split === "held-out" ? "v" : ""}">${r.split}</span></span>
            <span class="${r.ok ? "okc" : "warnc"}">${r.ok ? "match" : "differs"}</span>
          </div>
          <div class="rpd" id="rpd-${i}"><span class="mono dim">rules ${r.via.split(" · ")[1] ?? "—"}</span><span>${r.diff}</span></div>`).join("")}
      </div>
    </section>

    <section>
      <div class="sechead"><h2>Rule evidence</h2><span class="legend"><i class="sq hi"></i>agrees <i class="sq mid"></i>mostly <i class="sq low"></i>breaks</span></div>
      <div class="list">
        <div class="it re dim" style="font-size:12px"><span></span><span>Rule</span><span>Decisions it explains</span><span class="mrange" style="--n:${W.months.length};--h:${W.heldOutFrom}"><span>learned ${W.months[0]}–${W.months[W.heldOutFrom - 1]}</span><span>held out ${W.months[W.heldOutFrom]}–${W.months.at(-1)}</span></span><span>Counterexamples</span></div>
        ${E.rules.map((r) => `
          <div class="it re click" data-id="${r.id}">
            <span class="rid">${r.id}</span>
            <span>${r.text}</span>
            <span><span class="mono" style="font-size:13px">${r.support[0].toLocaleString()} / ${r.support[1].toLocaleString()}</span> <span class="dim" style="font-size:12px">${r.unit ?? "decisions"}</span><span class="sbar"><i style="width:${(r.support[0] / r.support[1]) * 100}%"></i></span></span>
            <span class="mstrip" style="--n:${W.months.length}">${r.months ? r.months.map((v, i) => `<i class="sq ${shade(v)} ${i >= W.heldOutFrom ? "ho" : ""}" title="${W.months[i]}: ${v ?? "—"}%"></i>`).join("") : `<span class="tag v" style="grid-column: 1 / -1; justify-self: start">asked · history can't settle it</span>`}</span>
            <span class="${r.support[1] - r.support[0] ? "" : "dim"}">${r.support[1] - r.support[0] ? (r.support[1] - r.support[0]) + (r.support[1] - r.support[0] === 1 ? " case" : " cases") : "none"}</span>
          </div>`).join("")}
      </div>
      <div class="inspect" id="evtip"></div>
    </section>`;
  copy();

  $$("#replays .rp.click").forEach((row) => row.onclick = () => {
    const d = $(`#rpd-${row.dataset.i}`);
    const open = d.classList.toggle("on");
    row.classList.toggle("sel", open);
  });

  const tip = $("#evtip");
  const idle = `<div class="tk">Hover a rule</div><div class="td">Each square is one month. ${W.months[0]}–${W.months[W.heldOutFrom - 1]} is what walter learned from; ${W.months[W.heldOutFrom]}–${W.months.at(-1)} (outlined) is held out. A rule that stops agreeing with recent history is flagged as a change.</div>`;
  tip.innerHTML = idle;
  $$(".re.click").forEach((row) => {
    row.addEventListener("mouseenter", () => {
      const r = E.rules.find((x) => x.id === row.dataset.id);
      $$(".re.click").forEach((x) => x.classList.toggle("sel", x === row));
      tip.innerHTML = `<div class="tk">${r.id} · ${r.asked ? "waiting on an answer" : r.drift ? "change detected" : "confirmed by history"}</div>
        <div class="tt">${r.text}</div>
        <div class="td">Explains ${r.support[0].toLocaleString()} of ${r.support[1].toLocaleString()} ${r.unit ?? "decisions"}.</div>
        ${r.drift ? `<div class="tm warnc">${r.drift}</div>` : ""}
        ${r.counter.length ? `<div class="tm">Counterexamples:<br>${r.counter.map((c) => "· " + c).join("<br>")}</div>` : `<div class="tm">No counterexamples in history.</div>`}`;
    });
  });
  $$(".re.click")[0].parentElement.addEventListener("mouseleave", () => { $$(".re.click").forEach((x) => x.classList.remove("sel")); tip.innerHTML = idle; });

}

// ── dot matrix: 12 × 12, one column per 2-hour window ───────────────────
const COLS = 12, ROWS = 12, GAP = 9.6, R = 2.9, SIZE = 116;
let dotRaf = 0;
function startDots() {
  cancelAnimationFrame(dotRaf);
  const canvases = $$("canvas[data-dots]");
  const dpr = window.devicePixelRatio || 1;
  for (const c of canvases) { c.width = SIZE * dpr; c.height = SIZE * dpr; c.getContext("2d").scale(dpr, dpr); }
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue("--accent").trim(), warn = css.getPropertyValue("--warn").trim();
  const frame = (t) => {
    if (!document.body.contains(canvases[0])) return;
    for (const c of canvases) {
      const m = MCPS.find((x) => x.id === c.dataset.dots);
      const ctx = c.getContext("2d");
      ctx.clearRect(0, 0, SIZE, SIZE);
      for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) {
        const cx = 2 + x * GAP + R, cy = 2 + y * GAP + R;
        let color = "rgba(255,255,255,0.08)", a = 1;
        if (m.status === "live") {
          const v = m.volume, peak = Math.max(2, ...v.map((_, i) => i % 2 ? 0 : v[i] + v[i + 1]));
          const lit = ((v[2 * x] + v[2 * x + 1]) / peak) * ROWS;
          if (ROWS - y <= lit) {
            const wave = 0.55 + 0.45 * Math.sin(t / 700 - x * 0.6 + y * 0.35);
            color = `rgba(196,181,253,${0.35 + 0.6 * wave})`;
          }
        } else if (m.status === "build") {
          const filled = Math.floor((m.progress / 100) * COLS * ROWS);
          const i = x * ROWS + y;
          if (i < filled) color = `rgba(196,181,253,${0.55 + 0.25 * Math.sin(t / 650 - x * 0.5)})`;
          else if (i === filled) color = accent;
        } else if (m.status === "ask") {
          if (x === 8 && y === 3) { color = warn; a = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t / 300)); }
        }
        ctx.globalAlpha = a;
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    dotRaf = requestAnimationFrame(frame);
  };
  dotRaf = requestAnimationFrame(frame);
}

function route() {
  const [path, opt] = location.hash.slice(1).split(",");
  const [id, sub] = path.split("/");
  const m = MCPS.find((x) => x.id === id);
  if (m && sub === "evals") return renderEvals(m), window.scrollTo({ top: 0 });
  m ? renderDetail(m) : renderList();
  // #sales,hover=R1 opens a node's card (handy for screenshots and demos)
  const hover = /^hover=(.+)$/.exec(opt ?? "")?.[1];
  if (m && hover) setTimeout(() => $(`.node[data-key="${CSS.escape(decodeURIComponent(hover))}"]`)?.dispatchEvent(new Event("mouseenter")), 50);
  window.scrollTo({ top: 0 });
}
// Served by the platform: same origin. Opened as a file: talk to the local platform.
const API = location.protocol === "file:" ? "http://localhost:4500" : "";
let lastJson = "";
async function load(force) {
  try {
    const r = await fetch(`${API}/api/state`, { cache: "no-store" });
    const j = await r.json();
    const text = JSON.stringify(j);
    if (!force && text === lastJson) return;
    lastJson = text;
    MCPS = j.mcps; EVALS = j.evals;
    // don't redraw under the cursor on the overview tree unless something material changed
    route();
  } catch (e) {
    $("#app").innerHTML = `<section><div class="empty" style="padding:28px">walter's API is not reachable at ${API || location.origin}. Start it with <code>npx tsx walter/platform/server.ts</code> and open http://localhost:4500.</div></section>`;
  }
}
window.addEventListener("hashchange", route);
load(true);
setInterval(() => load(false), 5000);
</script>
